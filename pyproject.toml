[project]
name = "cooperagents"
version = "0.1.0"
description = "A self-evolving, unified harness for a team of LLM agents (uses CooperBench only for evaluation)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0",
]

[project.optional-dependencies]
# Real backends — kept optional so the core harness and its tests run
# with no external services (in-memory bus + scripted LLM + local env).
redis = ["redis>=5.0"]
llm = ["litellm>=1.40", "openai>=1.40"]
# The vendored mini-swe-agent worker (cooperagents.vendor.mini_swe).
mini = ["litellm>=1.40", "jinja2>=3.1", "pydantic>=2.0", "tenacity>=8.0", "pyyaml>=6.0"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "fakeredis>=2.20",
]
all = ["cooperagents[redis,llm,dev]"]

[project.scripts]
cooperagents = "cooperagents.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cooperagents"]

[tool.ruff]
line-length = 140
src = ["src", "tests"]
extend-exclude = ["src/cooperagents/vendor", "runs", "logs*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["src/cooperagents"]
exclude = "src/cooperagents/vendor/"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
